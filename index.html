<title>Clipboard: NBA coach simulator</title>

<style>
*{box-sizing:border-box}
:root{--bg:#16221e;--card:#1f302b;--line:#35504a;--chalk:#eef0e6;--dim:#9fb4ab;--home:#4d8bff;--away:#ee5b45;--gold:#ffd23f}
body{margin:0;background:var(--bg);color:var(--chalk);font:14px/1.45 Barlow,'Segoe UI',sans-serif}
.app{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:14px;padding:14px;max-width:1340px;margin:auto}
aside,main{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
h1,h2{font-family:'Barlow Condensed',sans-serif;margin:0}
h1{font-size:26px}h1 small{font:400 14px Barlow,sans-serif;color:var(--dim);margin-left:8px}
h2{font-size:20px;margin-bottom:8px}
.t{min-width:0}.t.r{display:flex;flex-direction:column;align-items:flex-end}.sb{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px}
.t{border-left:5px solid var(--home);padding-left:12px}.t.r{border:0;border-right:5px solid var(--away);padding:0 12px 0 0;text-align:right}
.nm{font:700 22px 'Barlow Condensed',sans-serif}.sc{display:block;font:700 54px/1 'Barlow Condensed',sans-serif}.sub{color:var(--dim);font-size:12.5px}
.mid{text-align:center}#clk{font:700 34px 'Barlow Condensed',sans-serif}#sc24{color:var(--gold)}
.cw{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
canvas{display:block;width:100%;aspect-ratio:94/50}
#msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(22,34,30,.94);border:1px solid var(--gold);border-radius:8px;padding:12px 18px;text-align:center;max-width:88%}
#msg:empty{display:none}
.bar{display:flex;flex-wrap:wrap;gap:8px}
button{font:600 13px Barlow,sans-serif;background:transparent;color:var(--chalk);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--chalk)}button.on{background:var(--chalk);color:var(--bg)}
#pp{background:var(--gold);border-color:var(--gold);color:#16221e;min-width:74px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
label{display:flex;justify-content:space-between;margin:10px 0 3px;color:var(--dim)}label output{color:var(--chalk)}
label.ck{justify-content:flex-start;gap:8px;color:var(--chalk)}
select,input[type=range]{width:100%}
select{background:var(--bg);color:var(--chalk);border:1px solid var(--line);border-radius:6px;padding:6px}
.r,.rh{display:grid;grid-template-columns:28px 1fr 64px 26px 32px;gap:6px;align-items:center;padding:5px 6px;border-radius:6px}
.rh{color:var(--dim);font-size:12px}.r{cursor:pointer;border:1px solid transparent}.r:hover{background:#2a403a}
.r.sel{border-color:var(--gold);background:#3a3a1e}.r.out{opacity:.4}.r em{color:var(--dim);font-style:normal;margin-left:4px}
.sep{margin:8px 0 2px;color:var(--dim);font-size:12px}
.eb{height:7px;background:#0f1815;border-radius:4px;overflow:hidden}.eb i{display:block;height:100%}
ul{margin:0;padding-left:18px}li{margin:4px 0}.dim{color:var(--dim)}
#tab{max-height:250px;overflow:auto;font-size:13px}.hide{display:none!important}#courtbox{max-height:430px;overflow:auto}#courtbox table{font-size:12px}#courtbox th,#courtbox td{padding:3px 4px}#tab div{padding:2px 0;border-bottom:1px solid #2a403a}
table{width:100%;border-collapse:collapse;margin-bottom:10px;font-size:13px}caption{text-align:left;font:700 17px 'Barlow Condensed',sans-serif;padding:4px 0}
th,td{text-align:right;padding:2px 5px}th:first-child,td:first-child{text-align:left}th{color:var(--dim);font-weight:400}
@media(max-width:920px){.app{grid-template-columns:1fr}.sc{font-size:40px}}
.lg{height:34px;width:34px;object-fit:contain;vertical-align:middle;margin-right:8px}#start{position:fixed;inset:0;background:rgba(10,16,14,.94);display:flex;align-items:center;justify-content:center;z-index:9999;pointer-events:auto}#start .card,#start button,#start select{position:relative;pointer-events:auto;z-index:10000}#start.hide{display:none}#start .card{width:min(420px,92vw)}#warn{color:var(--away);min-height:20px}.rotl{position:relative}.rotl .r{position:absolute;left:0;right:0;height:34px;transition:transform .4s cubic-bezier(.2,.8,.2,1),background .25s,border-color .25s,opacity .25s}.rotl .sepl{position:absolute;left:0;right:0;height:22px;transition:transform .4s;font-size:12px}
.r,.rh{grid-template-columns:28px minmax(0,1fr) 54px 24px 28px 34px !important;font-size:13px}.r span:nth-child(2){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.r.ent{background:#1e3a2c;border-color:#58c98b}.r.lea{opacity:.65;border-color:#ee5b45}.tg{font-size:11px;font-weight:600;color:var(--gold)}

.mg{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;margin-top:8px}#pbook{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start}.pcol h3{font:700 15px 'Barlow Condensed',sans-serif;margin:0 0 4px;color:var(--dim)}.pcol .pb{display:block;width:100%;margin-bottom:4px;text-align:left;font-size:12px}.pb.on{background:var(--chalk);color:var(--bg)}
#pc{width:100%;display:block;border-radius:8px;border:1px solid var(--line)}.rad{display:block;margin:2px 0;color:var(--chalk)}.rad em{color:var(--dim);font-style:normal}@media(max-width:820px){.mg{grid-template-columns:1fr}}
#side3{max-height:440px;overflow:auto}#scoutCard{padding:4px 0 10px}</style>
</head>

function renderScouting(){const selEl=$('#scoutPlayer'),card=$('#scoutCard');if(!selEl||!card||!T)return;const all=T.flatMap((t,ti)=>t.pl.map((p,i)=>({p,ti,i,t})));const old=selEl.value;selEl.innerHTML=all.map(({p,ti,i,t})=>`<option value="${ti}:${i}">${t.short} · ${p.n} (${p.pos})</option>`).join('');if(old&&[...selEl.options].some(o=>o.value===old))selEl.value=old;const [ti,idx]=(selEl.value||'0:0').split(':').map(Number),p=T[ti].pl[idx],a=p.attr;const groups=[['Athleticism',[['Speed',a.speed],['Acceleration',a.accel],['Agility',a.agility],['Strength',a.strength],['Vertical',a.vertical],['Stamina',a.stamina]],],['IQ & effort',[['Basketball IQ',a.iq],['Anticipation',a.anticipation],['Hustle',a.hustle],['Loose-ball pursuit',a.loose]],],['Skills',[['Handle',a.handle],['Finishing',a.finish],['Perimeter defense',a.perimeter],['Interior defense',a.interior],['Screen navigation',a.screen],['Offensive rebounding',a.oreb],['Defensive rebounding',a.dreb]]]];card.innerHTML=`<div style="font-weight:700;margin:8px 0">${p.n} · ${p.pos} · OVR ${p.ovr}</div><div class="dim" style="font-size:11px;margin-bottom:8px">${p.attrSource}</div>`+groups.map(([name,rows])=>`<div style="font-size:12px;font-weight:700;margin:9px 0 4px">${name}</div>`+rows.map(([label,v])=>`<div style="display:grid;grid-template-columns:1fr 28px;gap:8px;margin:4px 0;font-size:11px"><span>${label}<span style="display:block;background:#25362f;height:4px;border-radius:4px;margin-top:3px"><i style="display:block;width:${v}%;height:4px;background:${v>=85?'#58c98b':v<60?'#e8a34a':'#a3b5aa'};border-radius:4px"></i></span></span><b style="text-align:right">${v}</b></div>`).join('')).join('');}
$('#scoutPlayer')?.addEventListener('change',renderScouting);

 T.forEach((t,i)=>{$(`#s${i} .nm`).textContent=t.name;const im=$(`#lg${i}`),u=`https://cdn.nba.com/logos/nba/${TEAM_IDS[t.code]}/global/L/logo.svg`;if(im.dataset.u!==u){im.dataset.u=u;im.style.display='';im.onerror=()=>{im.style.display='none'};im.src=u}});
 $('#who').textContent='You are the head coach of the '+T[0].name;$('#s0').style.borderColor=T[0].col;$('#s1').style.borderColor=T[1].col;
 $('#s0 .sub').textContent=`${T[0].to} timeouts, ${T[0].pf} team fouls`;
 $('#s1 .sub').textContent=`Runs ${ST[T[1].style].n}, ${DF[T[1].def].n}, ${TN[T[1].tempo-1].toLowerCase()}`;
 $('#tl').textContent=TN[T[0].tempo-1];$('#gl').textContent=T[0].gam<35?'Stay home':T[0].gam>65?'Help and gamble':'Balanced';
 updRot();$('#tips').innerHTML=tips.length?tips.map(x=>`<li>${x}</li>`).join(''):'<li class="dim">No advice yet.</li>';
 $('#tab').innerHTML=tab===1?box():tab===2?seasonHTML():logs.slice(0,16).map(x=>`<div>${x}</div>`).join('');$('#courtbox').innerHTML=courtBox();[0,1,2,3].forEach(i=>$('#side'+i).classList.toggle('hide',sideTab!==i));renderScouting();document.querySelectorAll('[data-side]').forEach(b=>b.classList.toggle('on',+b.dataset.side===sideTab));updOppRot();
 $('#pp').textContent=paused?'Play':'Pause';$('#to').textContent=`Timeout (${T[0].to})`;
 document.querySelectorAll('[data-sp]').forEach(b=>b.classList.toggle('on',+b.dataset.sp===speed));
 document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',+b.dataset.tab===tab))}
const opt=(el,items)=>items.forEach(([v,t])=>el.add(new Option(t,v)));
Object.entries(ST).forEach(([k,v])=>$('#style').add(new Option(v.n,k)));Object.entries(DF).forEach(([k,v])=>$('#def').add(new Option(v.n,k)));Object.entries(CV).forEach(([k,v])=>$('#cov').add(new Option(v,k)));
opt($('#selMe'),TEAM_NAMES.map(t=>[t[0],t[1]]));opt($('#selDiff'),Object.keys(DIFF).map(k=>[k,k]));$('#selMe').value='MIA';$('#selDiff').value='Pro';
$('#goNew').onclick=()=>{const w=$('#warn');w.textContent='';try{const team=$('#selMe').value,diff=$('#selDiff').value;if(!team||!diff)throw new Error('Choose a team and difficulty first.');newSeason(team,diff);if(!SZ||!SZ.sched||!SZ.sched.length)throw new Error('Season schedule was not created.');init()}catch(e){w.textContent='Could not start season: '+(e&&e.message?e.message:String(e));console.error('New season failed',e)}};
$('#goCont').onclick=()=>{const w=$('#warn');w.textContent='';try{SZ=loadSZ();if(SZ)nextGame();else w.textContent='No saved season found. Choose New season.'}catch(e){w.textContent='Could not continue: '+(e&&e.message?e.message:String(e));console.error('Continue season failed',e)}};

$('#start').style.pointerEvents='auto';document.querySelectorAll('#start button,#start select').forEach(el=>{el.style.pointerEvents='auto';el.style.position='relative';el.style.zIndex='10001'});

['style','def','cov'].forEach(id=>$('#'+id).onchange=e=>{T[0][id]=e.target.value;ui()});$('#auto').onchange=e=>T[0].auto=e.target.checked;
$('#rot').onpointerdown=e=>{const r=e.target.closest('.r');if(r)rowTap(+r.dataset.i)};

$('#pbook').onclick=e=>{const b=e.target.closest('.pb');if(b)selPlay(PL.find(p=>p.n===b.dataset.n))};

$('#prun').onclick=()=>{const p=PS.p,S=PS.S;T[0].nextPlay={p,S};log(G.off===0?`${T[0].short} will run "${p.n}" on this possession`:`Queued "${p.n}" for our next possession`);closePlays();msg('Timeout. Make any substitutions, then press Play.')};

{const s=loadSZ();if(s){SZ=s;if(SZ.gi>=SZ.sched.length)SZ.gi=SZ.sched.length-1}else{newSeason('MIA','Pro')}init();showStart()}
